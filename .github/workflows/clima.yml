name: Autoejecucion Clima IA

on:
  schedule:
    - cron: '*/15 * * * *'  # Se ejecuta en la nube cada 30 minutos
  workflow_dispatch:        # Permite ejecutarlo manualmente desde la web

jobs:
  ejecutar-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests pandas xgboost joblib

      - name: Ejecutar Inferencia XGBoost
        run: python logger_clima_once.py

      - name: Guardar cambios en registro_clima.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registro_clima.csv
          git commit -m "Actualizar registro_clima.csv [skip ci]" || exit 0
          git push
